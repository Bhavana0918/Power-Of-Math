<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>To the Power of Math!</title>
    <style>
        h1 {
            color: #FFFFFF;
            font-family: system-ui;
            margin-left: 20px;
        }
        body {
            background-color: #222629;
        }
        label {
            color: #86C232;
            font-family: system-ui;
            font-size: 20px;
            margin-left: 20px;
            margin-top: 20px;
        }
        button {
            background-color: #86C232;
            border-color: #86C232;
            color: #FFFFFF;
            font-family: system-ui;
            font-size: 20px;
            font-weight: bold;
            margin-left: 30px;
            margin-top: 20px;
            width: 140px;
        }
        input {
            color: #222629;
            font-family: system-ui;
            font-size: 20px;
            margin-left: 10px;
            margin-top: 20px;
            width: 100px;
        }
        #result {
            color: #86C232;
            font-family: system-ui;
            font-size: 20px;
            margin-left: 20px;
            margin-top: 20px;
        }
    </style>
    <script>
            var callAPI = (base, exponent) => {
                if (isNaN(base) || isNaN(exponent)) {
                    document.getElementById('result').innerText = "Please enter valid numbers for base and exponent.";
                    return;
                }
                var myHeaders = new Headers();
                myHeaders.append("Content-Type", "application/json");
                var raw = JSON.stringify({ "base": base, "exponent": exponent });
                var requestOptions = {
                    method: 'POST',
                    headers: myHeaders,
                    body: raw,
                    redirect: 'follow'
                };

                fetch("https://uvoo0qvj9g.execute-api.us-east-1.amazonaws.com/dev", requestOptions)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json(); // Parses JSON directly
                    })
                    .then(result => {
                        if (result.result !== undefined) {
                            document.getElementById('result').innerText = "Result: " + result.result;
                        } else if (result.error) {
                            document.getElementById('result').innerText = "Error: " + result.error;
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        document.getElementById('result').innerText = "An error occurred while calculating.";
                    });
            };

    </script>
    
</head>
<body>
    <h1>TO THE POWER OF MATH!</h1>
    <form>
        <label>Base number:</label>
        <input type="text" id="base">
        <label>...to the power of:</label>
        <input type="text" id="exponent">
        <button type="button" onclick="callAPI(document.getElementById('base').value, document.getElementById('exponent').value)">CALCULATE</button>
    </form>
    
    
    <div id="result"></div>
</body>
</html>
