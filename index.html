<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Power of Math Calculator</title>
    <style>
        body {
            background-color: #222629;
            color: #FFFFFF;
            font-family: system-ui;
            text-align: center;
        }
        h1 {
            color: #86C232;
            animation: fadeIn 2s ease-in-out;
        }
        .container {
            width: 50%;
            margin: auto;
            background: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
            animation: slideUp 1s ease-in-out;
        }
        label, input, button {
            font-size: 18px;
            margin-top: 10px;
        }
        input {
            width: 80px;
            padding: 5px;
            text-align: center;
        }
        button {
            background-color: #86C232;
            border: none;
            color: #FFFFFF;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.2s, background-color 0.3s;
        }
        button:hover {
            background-color: #61892F;
            transform: scale(1.1);
        }
        #history {
            margin-top: 20px;
            text-align: left;
            padding: 10px;
        }
        .history-item {
            background: #444;
            padding: 5px;
            border-radius: 5px;
            margin-top: 5px;
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
    <script>
        function calculate(operation) {
            let num1 = parseFloat(document.getElementById('num1').value);
            let num2 = parseFloat(document.getElementById('num2').value);
            let result;
            
            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById('result').innerText = "Please enter valid numbers.";
                return;
            }
            
            switch(operation) {
                case 'power':
                    result = Math.pow(num1, num2);
                    break;
                case 'add':
                    result = num1 + num2;
                    break;
                case 'subtract':
                    result = num1 - num2;
                    break;
                case 'multiply':
                    result = num1 * num2;
                    break;
                case 'divide':
                    result = num2 !== 0 ? num1 / num2 : "Cannot divide by zero";
                    break;
                default:
                    result = "Invalid operation";
            }
            
            document.getElementById('result').innerText = "Result: " + result;
            addToHistory(num1, num2, operation, result);
        }
        
        function addToHistory(num1, num2, operation, result) {
            let historyDiv = document.getElementById("history-list");
            let newItem = document.createElement("div");
            newItem.className = "history-item";
            let opSymbol = { 'power': '^', 'add': '+', 'subtract': '-', 'multiply': '*', 'divide': '/' }[operation] || '?';
            newItem.innerText = `${num1} ${opSymbol} ${num2} = ${result}`;
            historyDiv.prepend(newItem);
        }
    </script>
</head>
<body>
    <h1>Power of Math Calculator</h1>
    <div class="container">
        <label>Number 1:</label>
        <input type="text" id="num1">
        <label>Number 2:</label>
        <input type="text" id="num2">
        <br>
        <button onclick="calculate('power')">Power (^)</button>
        <button onclick="calculate('add')">Add (+)</button>
        <button onclick="calculate('subtract')">Subtract (-)</button>
        <button onclick="calculate('multiply')">Multiply (*)</button>
        <button onclick="calculate('divide')">Divide (/)</button>
        <div id="result"></div>
    </div>
    <div id="history" class="container">
        <h2>Calculation History</h2>
        <div id="history-list"></div>
    </div>
</body>
</html>
