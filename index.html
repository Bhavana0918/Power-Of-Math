<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>To the Power of Math!</title>
    <style>
        h1 {
            color: #FFFFFF;
            font-family: system-ui;
            margin-left: 20px;
        }
        body {
            background-color: #222629;
        }
        label {
            color: #86C232;
            font-family: system-ui;
            font-size: 20px;
            margin-left: 20px;
            margin-top: 20px;
        }
        button {
            background-color: #86C232;
            border-color: #86C232;
            color: #FFFFFF;
            font-family: system-ui;
            font-size: 20px;
            font-weight: bold;
            margin-left: 30px;
            margin-top: 20px;
            width: 140px;
        }
        input {
            color: #222629;
            font-family: system-ui;
            font-size: 20px;
            margin-left: 10px;
            margin-top: 20px;
            width: 100px;
        }
        #result {
            color: #86C232;
            font-family: system-ui;
            font-size: 20px;
            margin-left: 20px;
            margin-top: 20px;
        }
    </style>
    <script>
        var callAPI = (base, exponent) => {
            if (isNaN(base) || isNaN(exponent)) {
             document.getElementById('result').innerText = "Please enter valid numbers for base and exponent.";
             return;
            }
            var myHeaders = new Headers();
            myHeaders.append("Content-Type", "application/json");
            var raw = JSON.stringify({ "base": base, "exponent": exponent });
            var requestOptions = {
                method: 'POST',
                headers: myHeaders,
                body: raw,
                redirect: 'follow'
            };
    
            fetch("https://hctwz2emjb.execute-api.us-east-1.amazonaws.com/dev/math", requestOptions)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(result => {
                    // The Lambda response has a nested JSON string in the `body` field
                    let parsedBody = JSON.parse(result.body);
                    if (parsedBody.result !== undefined) {
                        document.getElementById('result').innerText = "Result: " + parsedBody.result;
                    } else if (parsedBody.error) {
                        document.getElementById('result').innerText = "Error: " + parsedBody.error;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('result').innerText = "An error occurred while calculating.";
                });
        };
    </script>
    
</head>
<body>
    <h1>TO THE POWER OF MATH!</h1>
    <form>
        <label>Base number:</label>
        <input type="text" id="base">
        <label>...to the power of:</label>
        <input type="text" id="exponent">
        <button type="button" onclick="callAPI(document.getElementById('base').value, document.getElementById('exponent').value)">CALCULATE</button>
    </form>
    
    <!-- This is where the result will be displayed -->
    <div id="result"></div>
</body>
</html>
