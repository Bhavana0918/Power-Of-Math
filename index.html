<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>POWER OF MATH</title>
    <style>
        body {
            background-color: #1E1E2E;
            color: #FFFFFF;
            font-family: 'Poppins', sans-serif;
            text-align: center;
        }
        h1 {
            color: #FFD700;
            animation: fadeIn 2s ease-in-out;
            font-size: 32px;
        }
        .container {
            width: 60%;
            margin: auto;
            background: #282A36;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(255, 215, 0, 0.5);
            animation: slideUp 1s ease-in-out;
        }
        #display {
            width: 95%;
            font-size: 26px;
            text-align: right;
            padding: 12px;
            margin-bottom: 15px;
            background: #EEE;
            color: #222;
            border-radius: 8px;
            font-weight: bold;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: #a62470;
            border: none;
            color: #FFFFFF;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s, background-color 0.3s;
        }
        button:hover {
            background-color: #94045d;
            transform: scale(1.1);
        }
        .history-item {
            background: #444;
            padding: 8px;
            border-radius: 8px;
            margin-top: 5px;
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
    <script>
        let expression = "";
        function appendValue(value) {
            expression += value;
            document.getElementById('display').value = expression;
        }
        function clearDisplay() {
            expression = "";
            document.getElementById('display').value = "";
        }
        function calculate() {
            try {
                let result = eval(expression);
                document.getElementById('display').value = result;
                addToHistory(expression, result);
                expression = "" + result;
            } catch {
                document.getElementById('display').value = "Error";
                expression = "";
            }
        }
        function addToHistory(exp, result) {
            let historyDiv = document.getElementById("history-list");
            let newItem = document.createElement("div");
            newItem.className = "history-item";
            newItem.innerText = `${exp} = ${result}`;
            historyDiv.prepend(newItem);
        }
    </script>
</head>
<body>
    <h1>POWER OF MATH</h1>
    <div class="container">
        <input type="text" id="display" disabled>
        <div class="button-grid">
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('/')">÷</button>
            <button onclick="appendValue('Math.sqrt(')">√</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('*')">×</button>
            <button onclick="appendValue('Math.pow(')">xʸ</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('-')">-</button>
            <button onclick="appendValue('Math.log('))">log</button>
            
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="calculate()">=</button>
            <button onclick="appendValue('+')">+</button>
            <button onclick="appendValue('Math.sin(')">sin</button>
            
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>
            <button onclick="appendValue('%')">%</button>
            <button onclick="clearDisplay()">C</button>
            <button onclick="appendValue('Math.cos(')">cos</button>
        </div>
    </div>
    <div id="history" class="container">
        <h2>Calculation History</h2>
        <div id="history-list"></div>
    </div>
</body>
</html>
